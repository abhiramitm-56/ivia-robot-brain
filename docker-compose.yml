version: '3.8'

services:
  ivia-brain:
    build:
      context: .
      dockerfile: Dockerfile.pi
    image: ivia-brain:latest
    container_name: ivia_brain
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app/server
      - ./.env:/app/.env
    env_file:
      - .env
    environment:
      - PORT=8000
      - ENABLE_VISION=false
